<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="GeoBench: log and benchmark GNSS location accuracy on your phone.">
    <meta name="theme-color" content="#121212">
    <title>GeoBench</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

    <div class="card">
        <h2>Accuracy</h2>
        <div class="accuracy-display"><span id="accValue">--</span><span class="unit">m</span></div>

        <!-- Grid for extended GNSS metrics -->
        <div class="metrics-grid">
            <div class="metric"><span class="metric-label">Lat:</span> <span id="latValue" class="metric-value">--</span></div>
            <div class="metric"><span class="metric-label">Lng:</span> <span id="lngValue" class="metric-value">--</span></div>
            <div class="metric"><span class="metric-label">Altitude:</span> <span id="altValue" class="metric-value">--</span></div>
            <div class="metric"><span class="metric-label">Alt Acc:</span> <span id="altAccValue" class="metric-value">--</span></div>
            <div class="metric"><span class="metric-label">Speed:</span> <span id="speedValue" class="metric-value">--</span></div>
            <div class="metric"><span class="metric-label">Drift Δ:</span> <span id="driftValue" class="metric-value">--</span></div>
            <div class="metric"><span class="metric-label">TTFF:</span> <span id="ttffValue" class="metric-value">--</span></div>
            <div class="metric"><span class="metric-label">Update Δ:</span> <span id="deltaValue" class="metric-value">--</span></div>
        </div>

        <div>Data points: <span id="countDisplay" class="count-highlight">0</span></div>
    </div>

    <div class="controls-container">
        <button id="recordBtn">Start Recording</button>
        <button id="exportBtn" hidden>Export CSV</button>
    </div>

    <button id="lockScreenBtn">Lock Screen</button>

    <div id="touchLockOverlay" class="touch-lock-overlay">
        <div class="lock-accuracy" id="lockaccValueDisplay">-- m</div>
        <div class="lock-subtext">Screen Locked</div>
        <input type="range" id="unlockSlider" min="0" max="100" value="0" class="unlock-slider" aria-label="Slide right to unlock">
        <div class="lock-hint">Slide right to unlock</div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
